<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gavelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded pill -->
  <rect width="100" height="100" rx="24" fill="#0A0F1D" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="#1E293B" stroke-width="2" />

  <!-- Gavel Head -->
  <rect x="30" y="24" width="40" height="18" rx="4" transform="rotate(-30 50 33)" fill="url(#gavelGrad)" filter="url(#glow)" />
  
  <!-- Gavel Handle -->
  <rect x="47" y="38" width="6" height="38" rx="3" transform="rotate(-30 50 57)" fill="#94A3B8" />

  <!-- Lightning Bolt Accent -->
  <path d="M58 20 L76 20 L66 42 L80 42 L48 78 L56 50 L42 50 Z" fill="url(#boltGrad)" filter="url(#glow)" />
</svg>
